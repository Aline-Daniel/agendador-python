name: Testes Python - Agendador
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxe
        run: python -m compileall -q agendador.py tests/
      - name: Executar testes do agendador
        run: python -m unittest discover -s tests -v
